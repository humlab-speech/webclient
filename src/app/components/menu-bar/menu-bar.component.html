<header id="menu-bar" [class.menu-bar--back-button]="showBackToDashboardButton" [style.--hero-collapse]="heroCollapseProgress">
  <div class="menu-top-row">
    <div class="menu-left">
      <a class="brand-block" href="/" (click)="$event.preventDefault(); backButtonClicked()"
         [attr.aria-label]="'Visp, ' + brandSlogan + ' (start page)'">
        <img class="brand-logo" [src]="brandLogoPath" [alt]="'Visp – ' + brandSlogan">
      </a>

      <ng-container *ngIf="showBackToDashboardButton">
        <span class="bar-divider" aria-hidden="true"></span>
        <a id="visp-back-button" href="/" (click)="$event.preventDefault(); backButtonClicked()" aria-label="Back to dashboard">
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
          <span>Dashboard</span>
        </a>
      </ng-container>
    </div>

    <a class="host-node" [href]="hostNode.href" target="_blank" rel="noopener">
      <img class="host-node-logo" [src]="hostNode.logo" [alt]="hostNode.label">
    </a>

    <div class="topbar-actions">
      <div *ngIf="showUserActions" class="notification-wrapper" (click)="$event.stopPropagation()">
        <button class="icon-button notification-button" aria-label="Notifications" (click)="toggleNotificationsPanel($event)">
          <i class="fa fa-bell-o" aria-hidden="true"></i>
          <span *ngIf="unreadNotificationCount > 0" class="notification-dot"></span>
        </button>

        <div class="notifications-panel" *ngIf="isNotificationsPanelOpen" role="dialog" aria-label="Notifications panel">
          <div class="notifications-panel__header">
            <h3>Notifications</h3>
            <button class="notifications-panel__clear-button" *ngIf="notifications.length > 0" (click)="clearNotifications()">
              Clear
            </button>
          </div>

          <ul class="notifications-panel__list" *ngIf="notifications.length > 0; else noNotificationsTemplate">
            <li class="notifications-panel__item" *ngFor="let notification of notifications; trackBy: trackByNotificationId">
              <div class="notifications-panel__item-type" [ngClass]="'notifications-panel__item-type--' + notification.type">
                {{ notification.type }}
              </div>
              <p>{{ notification.message }}</p>
              <time>{{ notification.createdAt | date:'HH:mm:ss' }}</time>
            </li>
          </ul>

          <ng-template #noNotificationsTemplate>
            <p class="notifications-panel__empty">No notifications yet.</p>
          </ng-template>

          <button class="notifications-panel__close-button" (click)="closeNotificationsPanel($event)">
            Close
          </button>
        </div>
      </div>

      <button class="icon-button theme-toggle" (click)="themeService.toggle()"
              [attr.aria-label]="themeService.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
              [attr.title]="themeService.theme === 'dark' ? 'Light mode' : 'Dark mode'">
        <i class="fa fa-adjust" aria-hidden="true"></i>
      </button>

      <app-help-ctrl *ngIf="containerSessionViewActive"></app-help-ctrl>
      <app-user></app-user>
    </div>
  </div>

</header>
