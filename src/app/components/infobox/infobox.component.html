<article
  class="info-card"
  [ngSwitch]="infobox.name"
  [class.info-card--secure-infrastructure]="infobox.name === 'secure-infrastructure'"
  [class.info-card--reproducible-workflows]="infobox.name === 'reproducible-workflows'"
  [class.info-card--tools]="infobox.name === 'tools'"
>
  <div class="info-icon-wrap">
    <span class="tile-icon pale" *ngIf="infobox.name === 'data-management'">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.66 3.13 3 7 3s7-1.34 7-3V5"/><path d="M5 11v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"/></svg>
    </span>

    <span class="tile-icon pale" *ngIf="infobox.name === 'help-and-guides'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v4h1"/></svg>
    </span>

    <span class="tile-icon pale" *ngIf="infobox.name === 'secure-infrastructure'">
      <svg viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 5 3.5 7.8 7 9 3.5-1.2 7-4 7-9V6z"/><path d="m9.2 12.2 2 2 3.7-3.7"/></svg>
    </span>

    <span class="tile-icon pale" *ngIf="infobox.name === 'reproducible-workflows'">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.3-6.4"/><path d="M21 12a9 9 0 0 1-15.3 6.4"/><path d="m18 2.7.5 4.4-4.4-.5"/><path d="m6 21.3-.5-4.4 4.4.5"/></svg>
    </span>

    <span class="tile-icon pale" *ngIf="infobox.name === 'tools'">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </span>

    <h4>{{ infobox.title }}</h4>
  </div>

  <p>{{ infobox.body }}</p>

  <div class="resource-list" *ngSwitchCase="'help-and-guides'">

    <a href="#" class="resource-button" *ngIf="userIsLoggedIn" (click)="showHelpDialog(); $event.preventDefault()">
      <span class="resource-left">
        <span class="resource-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </span>
        Help
      </span>
      <span class="resource-arrow">↗</span>
    </a>

    <a href="mailto:support@humlab.umu.se" target="_blank" class="resource-button">
      <span class="resource-left">
        <span class="resource-icon">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 8 8 5 8-5"/></svg>
        </span>
        E-mail support
      </span>
      <span class="resource-arrow">↗</span>
    </a>
  </div>

  <div class="resource-list" *ngSwitchCase="'tools'">
    <a *ngIf="octraEnabled" [href]="octraUrl" target="_blank" rel="noopener noreferrer" class="resource-button">
      <span class="resource-left">
        <span class="resource-icon">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </span>
        Open Octra
      </span>
      <span class="resource-arrow">↗</span>
    </a>

    <div *ngIf="!octraEnabled" class="resource-disabled-message">
      Octra is currently unavailable in this environment.
    </div>
  </div>

</article>
